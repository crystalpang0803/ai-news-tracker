<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI & 机器人行业日报</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 2rem;
      max-width: 600px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    header p { color: #94a3b8; font-size: 0.9rem; }
    .loading {
      text-align: center;
      color: #64748b;
      margin: 3rem 0;
      font-size: 1.1rem;
    }
    .archive-list { list-style: none; margin-top: 2rem; }
    .archive-list li {
      padding: 0.8rem;
      border-bottom: 1px solid #1e293b;
    }
    .archive-list a {
      color: #818cf8;
      text-decoration: none;
      font-size: 1rem;
    }
    .archive-list a:hover { color: #a5b4fc; }
    .nav {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin: 1.5rem 0;
    }
    .nav input[type="date"] {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 1rem;
    }
    .nav button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    .nav button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <header>
    <h1>AI & 机器人行业日报</h1>
    <p id="subtitle">正在加载最新新闻...</p>
  </header>

  <div class="nav">
    <input type="date" id="dateInput">
    <button onclick="goToDate()">查看</button>
  </div>

  <div id="content">
    <p class="loading">⏳ 正在跳转到最新一期...</p>
  </div>

  <ul class="archive-list" id="archiveList"></ul>

  <script>
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateInput').value = today;

    function goToDate() {
      const date = document.getElementById('dateInput').value;
      if (date) window.location.href = 'output/' + date + '.html';
    }

    // Load manifest and redirect to latest
    fetch('output/manifest.json')
      .then(r => r.json())
      .then(dates => {
        if (dates.length > 0) {
          const latest = dates[dates.length - 1];
          document.getElementById('subtitle').textContent = '最新: ' + latest + ' | 共 ' + dates.length + ' 天记录';
          
          // Auto redirect to latest
          document.getElementById('content').innerHTML = 
            '<p class="loading"><a href="output/' + latest + '.html" style="color:#818cf8;font-size:1.2rem;">👉 点击查看最新一期 (' + latest + ')</a></p>';
          
          // Show archive list
          const list = document.getElementById('archiveList');
          dates.slice().reverse().forEach(date => {
            const li = document.createElement('li');
            li.innerHTML = '<a href="output/' + date + '.html">' + date + '</a>';
            list.appendChild(li);
          });
        } else {
          document.getElementById('content').innerHTML = '<p class="loading">暂无新闻数据</p>';
        }
      })
      .catch(() => {
        document.getElementById('subtitle').textContent = '';
        document.getElementById('content').innerHTML = '<p class="loading">暂无历史记录，请等待首次抓取完成</p>';
      });
  </script>
</body>
</html>

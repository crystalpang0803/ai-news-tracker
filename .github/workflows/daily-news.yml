name: Daily News Fetch

on:
  schedule:
    # GitHub Actions cron is best-effort and often delayed under load, so we
    # fire several times across the Beijing early-morning window (and use
    # off-peak minutes, never :00 / :30) to maximize the chance one run lands
    # before users open the site. All times are UTC; Beijing = UTC+8.
    # The edition date is computed in Beijing time inside fetcher.js, so every
    # run below produces that same Beijing calendar day's edition.
    - cron: '13 16 * * *'   # Beijing 00:13
    - cron: '7 18 * * *'    # Beijing 02:07
    - cron: '41 19 * * *'   # Beijing 03:41
    - cron: '23 21 * * *'   # Beijing 05:23
    - cron: '47 22 * * *'   # Beijing 06:47
    - cron: '17 0 * * *'    # Beijing 08:17 (morning backstop)
    - cron: '37 3 * * *'    # Beijing 11:37 (daytime backstop)
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Fetch news
        # Belt-and-suspenders: kill node at 9min (SIGTERM) / 9.5min (SIGKILL) so a
        # runaway run can never hit the 10min step hard-limit (which marks the job red).
        run: timeout --kill-after=30 540 node fetcher.js || echo "::warning::fetcher timed out or exited non-zero; continuing to commit step"
        timeout-minutes: 10

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add output/
          git diff --cached --quiet || git commit -m "📰 Daily news update $(date +%Y-%m-%d)"
          git push

  deploy:
    needs: fetch-news
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
